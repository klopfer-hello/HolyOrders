name: Validate release tag

# distribution runs via the packager (see .pkgmeta); this workflow only guards
# that a version tag is consistent: TOC version matches the tag and the
# CHANGELOG has a section for it (the packager shows that section to users)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive and validate version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TOC_VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' HolyOrders.toc | tr -d '\r')
          if [ "$TOC_VERSION" != "$VERSION" ]; then
            echo "TOC version ($TOC_VERSION) does not match tag ($VERSION)" >&2
            exit 1
          fi

      - name: Validate changelog section
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Verify TOC load list against the repo
        run: |
          fail=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            f="${line//\\//}"
            if [ ! -f "$f" ]; then
              echo "MISSING file referenced by TOC: $f" >&2
              fail=1
            fi
          done < HolyOrders.toc
          exit $fail
